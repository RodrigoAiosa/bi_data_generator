<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BI Data Generator PRO</title>
  <meta name="description" content="Gere bases de dados sintéticas em modelo estrela para praticar Power BI, DAX e SQL: 200 setores de negócio, medidas DAX prontas e exportação.">
  <meta name="theme-color" content="#121212">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">

  <style>
    :root {
      --accent: #F2C811;
      --bg: #121212;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Container com altura ligeiramente maior para empurrar o rodapé para fora da tela */
    #iframe-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: -45px; /* Empurra os 45px do rodapé para fora do limite visível */
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--bg);
    }

    /* Tela de carregamento */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--bg);
      color: var(--accent);
      font-size: 15px;
      z-index: 10;
      transition: opacity .3s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid rgba(242, 200, 17, .2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #slow { display: none; text-align: center; max-width: 320px; line-height: 1.5; padding: 0 16px; }
    #slow a { color: var(--accent); font-weight: 700; }
    #loading.slow #slow { display: block; }
  </style>
</head>
<body>

  <div id="loading" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div>Carregando a aplicação…</div>
    <div id="slow">
      A aplicação está demorando para responder.<br>
      Se preferir, <a id="fallback" href="#" target="_blank" rel="noopener">abra em uma nova aba</a>.
    </div>
  </div>

  <div id="iframe-wrapper">
    <iframe
      id="app"
      title="BI Data Generator PRO"
      allow="clipboard-write; clipboard-read"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>

  <script>
    (function () {
      var APP_URL = "https://ai-bidatagenerator.streamlit.app/";

      var frame = document.getElementById("app");
      var loading = document.getElementById("loading");
      var fallback = document.getElementById("fallback");

      var url = new URL(APP_URL);
      new URLSearchParams(window.location.search).forEach(function (v, k) {
        url.searchParams.set(k, v);
      });
      url.searchParams.set("embed", "true");
      url.searchParams.set("embed_options", "disable_scrolling");

      fallback.href = APP_URL;
      frame.src = url.toString();

      var slowTimer = setTimeout(function () {
        loading.classList.add("slow");
      }, 8000);

      frame.addEventListener("load", function () {
        clearTimeout(slowTimer);
        loading.classList.add("hidden");
        setTimeout(function () { loading.style.display = "none"; }, 350);
      });
    })();
  </script>
</body>
</html>
